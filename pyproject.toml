[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hipparchus"
version = "0.9.1"
description = "Online vector cartography desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.14.1",
  "shapely>=2.0",
  "skia-python>=87.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.1.0",
  # The world-outline tests exercise the committed Natural Earth shapefiles.
  # Keep their reader in the test environment even though the rest of the
  # optional map-provider stack remains behind the `maps` extra.
  "fiona>=1.9",
  # Used unguarded by three test files (test_status_bar.py, test_about.py,
  # test_raster_not_for_navigation.py) and by scripts/smoke_render.py and
  # scripts/make_about_art.py, but never declared anywhere -- every local
  # gated run happened to have it already, until a clean container without
  # it made the gap visible.
  "Pillow>=10.0",
]
maps = [
  "fiona>=1.9",
  "mapbox-vector-tile>=2.0",
  "osmium>=3.7",
  "pmtiles>=3.0",
  "pyarrow>=15.0",
  "rasterio>=1.3",
  "scikit-image>=0.22",
]

[project.scripts]
hipparchus = "hipparchus.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# The maker's mark is loaded at runtime, so it has to travel with the package
# rather than only existing in a checkout.
[tool.setuptools.package-data]
"hipparchus.ui" = ["assets/*.png"]

[tool.ruff.lint]
# **Stated rather than inherited.** With no `select` at all, ruff lints with
# whatever the installed version happens to default to — and that is not a
# constant. This repository was clean under 0.15 and reported 384 findings under
# 0.16, which had widened the default set; nothing in the code had changed, and
# CI went red on a release of the linter.
#
# These four are ruff's documented default through 0.15, so this preserves the
# behaviour the codebase was actually written against and makes the check
# reproducible on any version.
#
# The wider set is worth a look on its own terms rather than as a surprise: most
# of the 384 are `I001` import ordering, but `BLE001` (blind `except`) and `B023`
# (a loop variable captured by a closure) are real and would each need reading
# before being turned on.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
